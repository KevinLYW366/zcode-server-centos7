name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell syntax
        run: make lint
      - name: Run ShellCheck
        run: shellcheck bin/zcode-centos7 scripts/*.sh tests/*.sh
      - name: Run unit tests
        run: make test
