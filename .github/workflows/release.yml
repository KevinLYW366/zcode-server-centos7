name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check release version
        run: |
          cli_version=$(bin/zcode-centos7 --version | awk '{print $2}')
          test "v${cli_version}" = "${GITHUB_REF_NAME}"

      - name: Run checks
        run: |
          make lint
          make test
          shellcheck bin/zcode-centos7 src/ssh_probe_hook.bash scripts/*.sh tests/*.sh

      - name: Download verified runtime source
        run: |
          curl -fL \
            https://github.com/MikeWang000000/vscode-server-centos7/releases/download/1.137.0/vscode-server_1.137.0_x64.tar.gz \
            -o "${RUNNER_TEMP}/vscode-server_1.137.0_x64.tar.gz"

      - name: Build release bundle
        run: |
          make runtime VSCODE_ARCHIVE="${RUNNER_TEMP}/vscode-server_1.137.0_x64.tar.gz"
          make release
          cd dist
          sha256sum -c zcode-server-centos7-*-x86_64.tar.gz.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_args=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease_args+=(--prerelease); fi
          zcode_version=$(python3 -c 'import json; print(json.load(open("compatibility.json"))["source_server"]["version"])')
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --verify-tag "${prerelease_args[@]}" \
              --title "${GITHUB_REF_NAME} - ZCode ${zcode_version}" \
              --notes-file docs/RELEASE_NOTES.md
          gh release upload "${GITHUB_REF_NAME}" \
            dist/zcode-server-centos7-*-x86_64.tar.gz \
            dist/zcode-server-centos7-*-x86_64.tar.gz.sha256 \
            dist/zcode-server-centos7-*-compatibility.json \
            dist/zcode-server-centos7-*-compatibility.json.sha256 \
            --clobber
          gh release edit "${GITHUB_REF_NAME}" --draft=false "${prerelease_args[@]}"
